spring.application.name=hotel-booking
server.port=8080

# ========================================================
# Database Configuration
# Default: H2 file database (zero-configuration, runs immediately!)
# To use MySQL: comment out H2 and uncomment MySQL properties below.
# ========================================================

# --- Option A: H2 Database (Default - works out of the box) ---
spring.datasource.url=jdbc:h2:file:./data/hoteldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Option B: MySQL Database (Uncomment to enable MySQL) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/hotel_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate Settings ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
